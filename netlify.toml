# Netlify deploy config for the Next.js site in web/.
# IMPORTANT: `publish` must be set (the dashboard keeps injecting the base
# directory, which the adapter rejects). With the plugin active, ".next"
# (relative to base) is correct — the adapter wires functions + routing itself.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Pin the Next.js Runtime explicitly: guarantees the OpenNext adapter runs
# (SSR pages + API routes become serverless functions) instead of a static deploy.
[[plugins]]
  package = "@netlify/plugin-nextjs"
